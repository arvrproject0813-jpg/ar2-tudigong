<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6EEDF">
  <title>Tudigong's Neighborhood · 土地公的街坊</title>
  <meta http-equiv="Cache-Control" content="no-cache">
  <!-- Always load the newest CSS/JS: GitHub Pages lets browsers keep files for 10 minutes, so every file gets a
       ?v= stamp that changes every 2 minutes. If you add a new .js or .css file, add it to the lists below
       (a file that is not listed still works, it just may be cached for up to 10 minutes). -->
  <script>
  (function () {
    var v = Math.floor(Date.now() / 120000).toString(36);
    var css = ['tokens', 'base', 'components', 'pages', 'welcome'];
    var js = ['app', 'ar-diorama', 'ar', 'config', 'drag', 'icons', 'narration', 'ui',
      'pages/_stub', 'pages/p01-home', 'pages/p02-scan', 'pages/p03-howto', 'pages/p04-intro',
      'pages/p05-street-corner', 'pages/p06-land-use', 'pages/p07-objects', 'pages/p08-community-map',
      'pages/p09-touya-weiya', 'pages/p10-meinong-bogong', 'pages/p11-sentence', 'pages/p12-end'];
    var map = { imports: {} };
    var add = function (path) { map.imports[new URL(path, location.href).href] = new URL(path, location.href).href + '?v=' + v; };
    js.forEach(function (f) { add('js/' + f + '.js'); });
    add('content/content.js');
    document.write('<script type="importmap">' + JSON.stringify(map) + '<\/script>');
    css.forEach(function (f) { document.write('<link rel="stylesheet" href="css/' + f + '.css?v=' + v + '">'); });
    window.__APP_V = v;
  })();
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <main class="layout">
      <section id="stage" aria-label="Activity area"></section>
      <aside id="panel" class="panel" aria-label="Page information"></aside>
    </main>
  </div>
  <div id="toast-layer" aria-live="polite"></div>
  <div id="modal-layer"></div>
  <div id="rotate-overlay" role="alert">
    <svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="22" y="6" width="20" height="34" rx="4"/><path d="M29 35h6"/>
      <rect x="10" y="40" width="44" height="18" rx="4" stroke-dasharray="4 4"/>
      <path d="M50 14a14 14 0 0 1 0 20M50 34l-5-1M50 34l1-5"/>
    </svg>
    <p class="rotate-en">Please rotate your device</p>
    <p class="rotate-zh">請將裝置橫放</p>
  </div>
  <!-- A-Frame + MindAR are loaded on demand by js/ar.js (only when the scan page opens). -->
  <script>document.write('<script type="module" src="js/app.js?v=' + window.__APP_V + '"><\/script>');</script>
</body>
</html>
