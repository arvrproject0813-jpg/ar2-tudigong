<!doctype html>
<!-- Contact sheet of GLB models: preview.html?files=a.glb,b.glb (paths from the repo root). -->
<html><head><meta charset="utf-8"><base href="/">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>body{margin:0;background:#EFE6D2;font:13px sans-serif;display:flex;flex-wrap:wrap;gap:6px;padding:6px}figure{margin:0;background:#F8F2E4;border:1px solid #c9952e}figcaption{padding:2px 6px}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const files = (q.get('files') || '').split(',').filter(Boolean);
const W = +(q.get('w') || 360), H = +(q.get('h') || 300), yaw = +(q.get('yaw') || 35), pitch = +(q.get('pitch') || 22);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace;
const loader = new GLTFLoader();
window.done = (async () => {
  for (const f of files) {
    const g = await loader.loadAsync(f);
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight('#FFF6E6', '#7A6448', 1.1));
    const key = new THREE.DirectionalLight('#FFE7C2', 1.6); key.position.set(2, 3, 2.5); scene.add(key);
    const fill = new THREE.DirectionalLight('#D6ECE9', 0.5); fill.position.set(-2, 1, 1); scene.add(fill);
    const obj = g.scene; scene.add(obj);
    const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    const r = size.length() / 2;
    const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);
    const d = r / Math.sin(THREE.MathUtils.degToRad(15)) * 1.02;
    const ya = THREE.MathUtils.degToRad(yaw), pa = THREE.MathUtils.degToRad(pitch);
    cam.position.set(c.x + d * Math.sin(ya) * Math.cos(pa), c.y + d * Math.sin(pa), c.z + d * Math.cos(ya) * Math.cos(pa));
    cam.lookAt(c);
    renderer.render(scene, cam);
    const img = new Image(); img.src = renderer.domElement.toDataURL();
    const fig = document.createElement('figure'); fig.append(img);
    const cap = document.createElement('figcaption'); cap.textContent = `${f.split('/').pop()}  ${size.x.toFixed(2)}×${size.y.toFixed(2)}×${size.z.toFixed(2)}`;
    fig.append(cap); document.body.append(fig);
  }
  return true;
})();
</script></body></html>
